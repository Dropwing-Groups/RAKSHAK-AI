# RAKSHAK AI — full-stack local deployment
# Usage: docker compose up --build
#
# This brings up Redis, the Django backend (API + multi-agent AI core), and
# the Next.js frontend. Copy backend/.env.example -> backend/.env and
# frontend/.env.example -> frontend/.env.local before running if you want to
# customize ports/credentials; sane demo defaults are used otherwise.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - REDIS_URL=redis://redis:6379
      - LLM_PROVIDER=template
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_USE_MOCK=false
    depends_on:
      - backend
